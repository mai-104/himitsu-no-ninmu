/* =====================================================================
   10. GameManager（全体の流れ）
      title → instruction(1秒) → playing(5秒) → result(1秒) → 次のゲーム
                                                       └→ 失敗なら gameover
   ===================================================================== */
const GameManager = {
  state: "title",
  score: 0,
  current: null,
  lastClass: null,
  timer: 0,
  playTime: 0,

  init() {
    UI.startScreen.addEventListener("pointerdown", (e) => { e.stopPropagation(); this.startRun(); });
    UI.overScreen.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      if (this.timer > 0.6) this.startRun();
    });
    Input.handler = this;
    Motion.handler = this;
    this.initMotionToggle();
    this.initTestMode();
  },

  /* ---------- テストモード ----------
     一覧から選んだゲームだけを遊ぶ。終わったら（クリアでも失敗でも）一覧に戻る。
     「順番に全部」は、失敗しても止まらず登録順に最後まで流す。 */
  mode: "normal",       // "normal" | "test"
  testQueue: [],
  testLevel: 0,
  REQUIRE_LABELS: { motion: "振る操作をONにすると遊べます" },

  initTestMode() {
    const stop = (el) => el.addEventListener("pointerdown", (e) => e.stopPropagation());
    const open = UI.$("testOpen");
    stop(open);
    open.addEventListener("click", (e) => { e.stopPropagation(); this.openTest(); });
    UI.$("testAll").addEventListener("click", () => this.startTest(GameRegistry.available()));
    UI.$("testBack").addEventListener("click", () => {
      UI.show(UI.$("testScreen"), false);
      UI.show(UI.startScreen, true);
      this.mode = "normal";
      this.enter("title");
    });
    const setLv = (d) => {
      this.testLevel = Math.max(0, Math.min(20, this.testLevel + d));
      UI.$("lvValue").textContent = this.testLevel;
    };
    UI.$("lvDown").addEventListener("click", () => setLv(-1));
    UI.$("lvUp").addEventListener("click", () => setLv(1));
  },

  openTest() {
    if (this.current) { this.current.dispose(); this.current = null; }
    UI.hideBanner();
    UI.show(UI.hud, false);
    UI.show(UI.startScreen, false);
    UI.show(UI.overScreen, false);
    // 一覧を作り直す（振る操作のON/OFFで遊べるゲームが変わるため）
    const list = UI.$("testList");
    list.textContent = "";
    GameRegistry.list.forEach((G) => {
      const missing = (G.meta.requires || []).filter((n) => !Features[n]?.());
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "game-btn";
      btn.disabled = missing.length > 0;
      const name = document.createElement("b");
      name.textContent = G.meta.instruction;
      const note = document.createElement("small");
      note.textContent = missing.length ? missing.map((n) => this.REQUIRE_LABELS[n] || n).join(" / ") : G.meta.id;
      btn.append(name, note);
      btn.addEventListener("click", () => this.startTest([G]));
      list.append(btn);
    });
    UI.show(UI.$("testScreen"), true);
    this.mode = "test";
    this.enter("test");
  },

  startTest(classes) {
    if (!classes.length) return;
    this.mode = "test";
    this.testQueue = classes.slice();
    UI.show(UI.$("testScreen"), false);
    UI.show(UI.hud, true);
    UI.setScore("TEST");
    this.nextGame();
  },

  /** スタート画面の「振る操作」ボタン */
  initMotionToggle() {
    const btn = UI.$("motionToggle"), status = UI.$("motionStatus");
    const render = () => {
      btn.setAttribute("aria-pressed", String(Motion.enabled));
      btn.textContent = `振る操作：${Motion.enabled ? "ON" : "OFF"}`;
    };
    // ボタンに触れてもゲームが始まらないようにする
    btn.addEventListener("pointerdown", (e) => e.stopPropagation());
    // 許可ダイアログは click の中で出す必要がある（iPhone）
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (Motion.enabled) {
        Motion.disable(); render();
        status.textContent = "振るゲームは出ません";
        return;
      }
      btn.disabled = true;
      status.textContent = "センサーを確認中…スマホを軽く動かしてください";
      const r = await Motion.enable();
      btn.disabled = false;
      render();
      status.textContent = {
        ok: "ON：振るゲームも出てきます",
        unsupported: "この端末・ブラウザでは使えません",
        denied: "許可されなかったので OFF のままです",
        nodata: "この画面では使えません。ブラウザで直接開くと使える場合があります（Androidはサイト設定の「モーションセンサー」も確認）",
      }[r];
    });
  },

  startRun() {
    Sound.se("start"); Sound.bgm("play");
    this.mode = "normal";
    this.score = 0;
    UI.setScore(0);
    UI.show(UI.startScreen, false);
    UI.show(UI.overScreen, false);
    UI.show(UI.hud, true);
    this.nextGame();
  },

  nextGame() {
    Sound.se("instruction");
    if (this.current) this.current.dispose();
    UI.setHint("");
    const test = this.mode === "test";
    const GameClass = test ? this.testQueue.shift() : GameRegistry.pickRandom(this.lastClass);
    this.lastClass = GameClass;
    this.duration = GameClass.meta.duration || CONFIG.gameTime;
    this.current = new GameClass({ engine: Engine, difficulty: test ? this.testLevel : this.score, duration: this.duration });
    this.current.setup();
    UI.setTime(this.duration, this.duration);
    UI.banner(GameClass.meta.instruction);
    this.enter("instruction");
  },

  enter(state) { this.state = state; this.timer = 0; },

  // --- Input からの通知（プレイ中だけゲームに渡す） ---
  tap(info)        { if (this.state === "playing") { Sound.se("tap"); this.current.onTap(info); } },
  drag(info)       { if (this.state === "playing") this.current.onDrag(info); },
  release(info)    { if (this.state === "playing" || this.state === "result") this.current.onRelease(info); },
  swipe(dir, info) { if (this.state === "playing") this.current.onSwipe(dir, info); },
  shake(power)     { if (this.state === "playing") this.current.onShake(power); },
  motion(power)    { if (this.state === "playing") this.current.onMotion(power); },

  update(dt) {
    this.timer += dt;
    const g = this.current;
    switch (this.state) {
      case "instruction":
        if (this.timer >= CONFIG.instructionTime) {
          UI.hideBanner();
          this.playTime = 0;
          this.enter("playing");
        }
        break;
      case "playing":
        this.playTime += dt;
        g._tick(dt, this.playTime);
        UI.setTime(this.duration - this.playTime, this.duration);
        if (!g.result && this.playTime >= this.duration) g.onTimeUp();
        if (g.result) this.finish(g.result);
        break;
      case "result":
        g._tick(dt, this.playTime += dt);   // 演出は続ける
        if (this.timer >= CONFIG.resultTime) {
          if (this.mode === "test") this.testQueue.length ? this.nextGame() : this.openTest();
          else if (this.lastResult === "win") this.nextGame();
          else this.gameOver();
        }
        break;
    }
  },

  finish(result) {
    Sound.se(result === "win" ? "clear" : "fail");
    this.lastResult = result;
    if (result === "win") {
      if (this.mode !== "test") { this.score++; UI.setScore(this.score); }
      UI.banner("CLEAR!", "clear");
    } else {
      UI.banner("GAME OVER", "fail");
    }
    this.enter("result");
  },

  gameOver() {
    Sound.se("gameover"); Sound.bgm("title");
    UI.hideBanner();
    UI.show(UI.hud, false);
    UI.finalScore.textContent = this.score;
    UI.show(UI.overScreen, true);
    this.enter("gameover");
  },
};

/* ---------- 3Dの物の差し替え（MODEL_FILES） ----------
   起動時に読み込んでおき、ゲームの中で Models.〇〇() が呼ばれた時に差し替える。
   元の形は「見えないまま」残すので、ゲームの中の動き（ふたが飛ぶ等）はそのまま動きます */
const ModelSwap = {
  tpl: {},
  preload() {
    const keys = Object.keys(MODEL_FILES).filter((k) => Models[k] && (MODEL_FILES[k].glb || MODEL_FILES[k].png));
    if (!keys.length) return;
    const needGlb = keys.some((k) => MODEL_FILES[k].glb);
    const loader = needGlb ? new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"; s.onload = () => res(new THREE.GLTFLoader()); s.onerror = rej; document.head.appendChild(s); }) : null;
    for (const k of keys) {
      const f = MODEL_FILES[k];
      if (f.glb) loader.then((l) => l.load(f.glb, (g) => (this.tpl[k] = { obj: g.scene }))).catch(() => {});
      else Assets._loader.load(f.png, (tex) => (this.tpl[k] = { tex }));
    }
    for (const k of keys) {
      const orig = Models[k];
      Models[k] = function (...args) {
        const base = orig.apply(this, args), t = ModelSwap.tpl[k];
        if (!t) return base;
        // 元の形の大きさ・位置に合わせる
        const box = new THREE.Box3().setFromObject(base), size = new THREE.Vector3(), c = new THREE.Vector3();
        box.getSize(size); box.getCenter(c);
        const h = MODEL_FILES[k].size || size.y || 1;
        let vis;
        if (t.obj) {
          vis = t.obj.clone(true);
          const b2 = new THREE.Box3().setFromObject(vis), s2 = new THREE.Vector3(), c2 = new THREE.Vector3();
          b2.getSize(s2); b2.getCenter(c2);
          const sc = h / Math.max(s2.y, .001);
          vis.scale.setScalar(sc); vis.position.set(c.x - c2.x * sc, c.y - c2.y * sc, c.z - c2.z * sc);
        } else {
          const ar = t.tex.image.width / t.tex.image.height;
          vis = new THREE.Mesh(new THREE.PlaneGeometry(h * ar, h), new THREE.MeshBasicMaterial({ map: t.tex, transparent: true, alphaTest: .05, side: THREE.DoubleSide }));
          vis.position.copy(c);
        }
        base.traverse((o) => { if (o.isMesh) o.visible = false; });
        base.add(vis);
        return base;
      };
    }
  },
};

/* ---------- 起動 ---------- */
ModelSwap.preload();
Object.keys(ASSETS).forEach((k) => Assets.texture(k));   // 画像を先に読み込んでおく（キャンバスに描く物が最初から間に合うように）
Sound.init();
Sound.bgm("title");
if (ASSETS.titleLogo) { const h1 = document.querySelector("#startScreen h1"); h1.innerHTML = `<img src="${ASSETS.titleLogo}" alt="秘密の任務オールクリア" style="max-width:min(90vw,520px);max-height:30vh;display:block;margin:0 auto">`; }
if (Sound.any()) {
  const b = document.createElement("button"); b.type = "button"; b.className = "toggle sub"; b.id = "soundToggle";
  const label = () => (b.textContent = `音：${Sound.on ? "ON" : "OFF"}`); label();
  b.addEventListener("pointerdown", (e) => e.stopPropagation());
  b.addEventListener("click", (e) => { e.stopPropagation(); Sound.toggle(); label(); });
  document.getElementById("testOpen").before(b);
}
UI.init();
Engine.init(document.getElementById("stage"));
Input.init(document.getElementById("stage"));
GameManager.init();

// タイトル画面の飾り（TODO: タイトル用モデルに差し替え可）
const titleDeco = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6, 0), Assets.material("titleDeco", 0xffcf3f, { flatShading: true }));
Engine.scene.add(titleDeco);

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  titleDeco.visible = ["title", "gameover", "test"].includes(GameManager.state);
  if (titleDeco.visible) { titleDeco.rotation.x += dt * .4; titleDeco.rotation.y += dt * .6; }
  GameManager.update(dt);
  Engine.render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
