   傾けるゲーム（requires: ["tilt"]）／ ぴったり！
   ===================================================================== */

/* ---- ころがして！：傾けてボールを緑の穴に落とす（赤い穴は落ちると失敗） ---- */
class RollBallGame extends MiniGame {
  static meta = { id: "roll-ball", instruction: "ころがして！", requires: ["tilt"] };
  setup() {
    const { w, h } = Engine.viewSize(0);
    const bw = Math.min(w * .9, 4.4), bh = Math.min(h - 3.4, 6.6);
    const hw = bw / 2, hh = bh / 2;
    this.rb = .24;
    this.limX = hw - this.rb; this.limY = hh - this.rb;
    this.board = this.add(new THREE.Group());     // 板ごと傾けて見せる
    this.board.position.y = -.6;
    // 板  TODO: 板の画像に差し替え
    this.board.add(mesh(new THREE.BoxGeometry(bw, bh, .3), mat(0xc79a5b), 0, 0, -.15));
    for (const [x, y, fw, fh] of [[0, hh, bw + .3, .15], [0, -hh, bw + .3, .15], [-hw, 0, .15, bh], [hw, 0, .15, bh]]) {
      this.board.add(mesh(new THREE.BoxGeometry(fw, fh, .3), mat(0x7a5530), x, y, .05));
    }
    const hole = (x, y, r, color) => {   // TODO: 穴の見た目を差し替え
      this.board.add(mesh(new THREE.CircleGeometry(r, 28), mat(0x120d1f), x, y, .02));
      this.board.add(mesh(new THREE.RingGeometry(r, r + .07, 28), new THREE.MeshBasicMaterial({ color }), x, y, .03));
      return new THREE.Vector3(x, y, 0);
    };
    this.goalR = .4; this.trapR = .34;
    const goalP = new THREE.Vector3(rand(-.55, .55) * hw, rand(.35, .7) * hh, 0);
    const start = new THREE.Vector3(rand(-.6, .6) * hw, rand(-.8, -.5) * hh, 0);
    this.goal = hole(goalP.x, goalP.y, this.goalR, 0x5be3a1);
    this.traps = [];
    const nTrap = Math.min(3, Math.floor(this.difficulty / 3));   // 慣れてきたら赤い穴が出る
    for (let i = 0, tries = 0; i < nTrap && tries < 40; tries++) {
      const p = new THREE.Vector3(rand(-.75, .75) * hw, rand(-.25, .35) * hh, 0);
      if (p.distanceTo(goalP) < 1.1 || p.distanceTo(start) < 1.0 || this.traps.some((q) => q.distanceTo(p) < 1.0)) continue;
      this.traps.push(hole(p.x, p.y, this.trapR, 0xff5a6e)); i++;
    }
    // ボール  TODO: ボールの画像/モデルに差し替え
    this.ball = mesh(new THREE.SphereGeometry(this.rb, 24, 16), mat(0xdfe8ff, { metalness: .5, roughness: .25 }), start.x, start.y, this.rb + .02);
    this.board.add(this.ball);
    this.vx = 0; this.vy = 0; this.falling = null;
    this.hint("傾けて緑の穴へ");
  }
  update(dt) {
    const t = this.tilt();
    const k = Math.min(1, dt * 10);
    this.board.rotation.y += (t.x * .35 - this.board.rotation.y) * k;
    this.board.rotation.x += (-t.y * .35 - this.board.rotation.x) * k;
    const b = this.ball;
    if (this.falling) {   // 穴に落ちる演出
      b.position.x += (this.falling.x - b.position.x) * Math.min(1, dt * 12);
      b.position.y += (this.falling.y - b.position.y) * Math.min(1, dt * 12);
      b.scale.setScalar(Math.max(.05, b.scale.x - dt * 3));
      return;
    }
    const K = 24 + Math.min(this.difficulty, 15) * .5;
    this.vx += t.x * K * dt; this.vy += t.y * K * dt;
    const damp = Math.pow(.25, dt);
    this.vx *= damp; this.vy *= damp;
    const sp = Math.hypot(this.vx, this.vy);
    if (sp > 6) { this.vx *= 6 / sp; this.vy *= 6 / sp; }
    b.position.x += this.vx * dt; b.position.y += this.vy * dt;
    if (b.position.x > this.limX) { b.position.x = this.limX; this.vx *= -.4; }
    if (b.position.x < -this.limX) { b.position.x = -this.limX; this.vx *= -.4; }
    if (b.position.y > this.limY) { b.position.y = this.limY; this.vy *= -.4; }
    if (b.position.y < -this.limY) { b.position.y = -this.limY; this.vy *= -.4; }
    b.rotation.x -= this.vy * dt / this.rb; b.rotation.y += this.vx * dt / this.rb;
    if (this.result) return;
    if (Math.hypot(b.position.x - this.goal.x, b.position.y - this.goal.y) < this.goalR * .75) {
      this.falling = this.goal; this.win(); return;
    }
    for (const tp of this.traps) {
      if (Math.hypot(b.position.x - tp.x, b.position.y - tp.y) < this.trapR * .75) { this.falling = tp; this.lose(); return; }
    }
  }
}

/* ---- まっすぐ！：傾けて車を左右に動かし、道から外れないように走る（5秒走れたら成功） ---- */
class RoadGame extends MiniGame {
  static meta = { id: "road", instruction: "まっすぐ！", winOnTimeout: true, requires: ["tilt"] };
  setup() {
    const { w, h } = Engine.viewSize(0);
    this.W = w;
    const d = Math.min(this.difficulty, 12);
    this.half = Math.max(.85, Math.min(.95, w * .19) - d * .01);       // 道の幅の半分
    this.amp = Math.min(w * .24, 1.15) * (.95 + Math.min(d, 10) * .01) * (Math.random() < .5 ? -1 : 1);   // 最後に一番大きくなる時の曲がり幅
    this.f1 = rand(.35, .5); this.f2 = rand(.8, 1.0);
    this.speed = 4.2 + Math.min(d, 10) * .15;
    // 道のくねくねは、走るほど（5秒かけて）少しずつ大きくなる。最初は小さな曲がりだけ
    this.rampLen = this.speed * this.duration * .8;   // この距離で最大の大きさになる
    // 終盤に必ず一度は大きく曲がるよう、頂点を走行の終わり近くに合わせる（動かないと道から外れる）
    const peak = rand(.65, .85) * this.speed * this.duration;
    this.p1 = Math.PI / 2 - peak * this.f1; this.p2 = Math.PI / 2 - peak * this.f2;
    this.s = 0; this.carY = -3.0; this.carX = 0; this.vx = 0;
    // 地面  TODO: 背景画像に差し替え
    this.add(mesh(new THREE.PlaneGeometry(w + 2, h + 2), mat(0x2f6b3a), 0, 0, -.3));
    this.edgeMats = [mat(0xff5a6e), mat(0xffffff)];
    const asphalt = mat(0x3a3a46), n = 46, dy = (h + 1.2) / n;
    this.rows = [];
    for (let i = 0; i < n; i++) {
      const y = -h / 2 - .6 + (i + .5) * dy;
      const g = new THREE.Group();
      const e1 = mesh(new THREE.PlaneGeometry(.16, dy * 1.15), this.edgeMats[0], -this.half, 0, .01);
      const e2 = mesh(new THREE.PlaneGeometry(.16, dy * 1.15), this.edgeMats[0], this.half, 0, .01);
      g.add(mesh(new THREE.PlaneGeometry(this.half * 2, dy * 1.15), asphalt, 0, 0, 0), e1, e2);
      g.position.y = y;
      this.add(g);
      this.rows.push({ g, e1, e2, y });
    }
    // 車  TODO: 車のモデル/画像に差し替え
    this.car = this.add(new THREE.Group());
    this.carBody = mesh(new THREE.BoxGeometry(.42, .75, .2), mat(0xffcf3f), 0, 0, .12);
    this.car.add(this.carBody, mesh(new THREE.BoxGeometry(.3, .32, .16), mat(0x8fd3ff), 0, .02, .27));
    this.car.position.set(0, this.carY, .2);
    this.hint("傾けて道からはずれるな");
  }
  center(S) {   // 道の中心のx。スタート地点では真ん中、そこから少しずつくねくねする
    const env = Math.max(0, Math.min(1, S / 3));
    const grow = .2 + .8 * Math.max(0, Math.min(1, S / this.rampLen));   // 遠くの道ほど大きく曲がる（近づくにつれて大きくなって見える）
    return this.amp * env * env * (3 - 2 * env) * grow * (Math.sin(S * this.f1 + this.p1) * .75 + Math.sin(S * this.f2 + this.p2) * .25);
  }
  update(dt) {
    const t = this.tilt();
    if (this.result !== "lose") this.s += this.speed * dt;
    const target = this.result ? 0 : t.x * 11;
    this.vx += (target - this.vx) * Math.min(1, dt * 8);
    this.carX = Math.max(-this.W / 2 + .3, Math.min(this.W / 2 - .3, this.carX + this.vx * dt));
    this.car.position.x = this.carX;
    this.car.rotation.z = -this.vx * .05;
    for (const r of this.rows) {
      const S = this.s + (r.y - this.carY);
      r.g.position.x = this.center(S);
      const par = ((Math.floor(S / 1.1) % 2) + 2) % 2;   // 縁の赤白をしま模様に
      r.e1.material = r.e2.material = this.edgeMats[par];
    }
    if (!this.result && Math.abs(this.carX - this.center(this.s)) > this.half * .95) {
      this.carBody.material.color.set(0xff3b4e);
      this.lose();
    }
  }
}

/* ---- すべって！：傾けてペンギンを左右にすべらせ、氷の障害物を2回よけて、最後にゴールの布をくぐる ----
   斜め後ろから見る視点。内部は「左・右」2つのレーン。ペンギン自体は自由に横へすべる（慣性あり）ので、見た目は自由に動いているように見える。
   障害物は2回、レーン上に置く。最後は道が左右に分かれて、片方がゴール（旗の間に布）、もう片方は道が途切れて落ちる。
   障害物とゴールは、近づくと氷から生えてくる（最初は見えない）。
   ※ 世界は this.world の中に「x=左右, y=前方への距離, z=高さ」で作ってあり、全体を寝かせて地面にしている。 */
class PenguinGame extends MiniGame {
  static meta = { id: "penguin", instruction: "すべって！", winOnTimeout: false, requires: ["tilt"] };
  setup() {
    const { w } = Engine.viewSize(0);
    const d = Math.min(this.difficulty, 12);
    this.laneX = Math.min(w * .17, .85);                       // レーンの中心（左右）
    this.roadHalf = this.laneX + .9;                            // 道の半分の幅
    this.speed = 7 + Math.min(d, 10) * .12;
    const D = this.speed * this.duration;
    this.sObs = [D * .42, D * .62];                             // 障害物の位置（走った距離）
    this.sFork = D * .84;                                       // 分かれ道＝ゴールの布の位置
    this.KX = 6; this.INERTIA = 3.5; this.DEAD = .04;          // TODO: 傾き→速さの倍率／慣性（小さいほどツルツル）／無視する小さな傾き
    this.SEE = 13;                                              // これより近づくと障害物が見え始める距離（ゴールは+2）
    this.obsHalf = .6; this.penR = .22;
    // 1つ目の障害物はペンギンがいるレーンに置く → 動かないと必ずぶつかる。2つ目は反対レーン
    const startLane = Math.random() < .5 ? -1 : 1;
    this.lanes = [startLane, -startLane];
    this.goalSide = Math.random() < .5 ? -1 : 1;
    this.s = 0; this.px = startLane * this.laneX; this.vx = 0; this.fell = false;
    // 斜め後ろから見るカメラ（ゲームが終わると標準カメラに戻る）
    this.camera.position.set(0, 3.2, 8.6);   // TODO: 視点の高さ。小さいほど低く（地面すれすれ）、大きいほど上から見下ろす
    this.camera.lookAt(0, 0, -5);
    this.world = this.add(new THREE.Group());
    this.world.rotation.x = -Math.PI / 2;
    const W = this.world;
    // 海（落ちた先）  TODO: 背景画像に差し替え
    W.add(mesh(new THREE.PlaneGeometry(80, 90), mat(0x15406e), 0, 20, -.3));
    // 氷の道（左半分・右半分に分けて持つ）  TODO: 氷のテクスチャに差し替え
    const n = 64, y0 = -6, dy = 48 / n, hw = this.roadHalf / 2;
    this.iceMats = [mat(0xcfeeff), mat(0xe9f8ff)];
    this.rows = [];
    for (let i = 0; i < n; i++) {
      const y = y0 + (i + .5) * dy;
      const L = mesh(new THREE.PlaneGeometry(this.roadHalf, dy * 1.15), this.iceMats[0], -hw, y, 0);
      const R = mesh(new THREE.PlaneGeometry(this.roadHalf, dy * 1.15), this.iceMats[0], hw, y, 0);
      W.add(L, R);
      this.rows.push({ L, R, y });
    }
    // 障害物（氷のかたまり）  TODO: 障害物のモデルに差し替え
    this.obs = this.sObs.map((so, i) => {
      const g = new THREE.Group();
      g.add(mesh(new THREE.BoxGeometry(this.obsHalf * 2, .7, .5), mat(0x7fb8e8), 0, 0, .25),
            mesh(new THREE.BoxGeometry(this.obsHalf * 1.2, .45, .4), mat(0xb5defa), .05, .05, .55));
      g.rotation.z = rand(-.2, .2);
      W.add(g);
      return { g, s: so, lane: this.lanes[i] };
    });
    // ゴール（棒2本＋間に布）。ゴール側のレーンの上に立つ  TODO: ゴールゲートのモデルに差し替え
    this.gate = new THREE.Group();
    const gx = this.goalSide * this.laneX, gw = .75;
    const pole = (x) => { const m = mesh(new THREE.CylinderGeometry(.07, .07, 1.1, 8), mat(0xffffff), x, 0, .6); m.rotation.x = Math.PI / 2; return m; };
    this.gate.add(pole(gx - gw), pole(gx + gw), mesh(new THREE.BoxGeometry(gw * 2, .06, .5), mat(0xff4a5e), gx, 0, .85));
    W.add(this.gate);
    // ペンギン（お腹ですべる）  TODO: ペンギンのモデルに差し替え
    this.peng = new THREE.Group();
    const body = mesh(new THREE.SphereGeometry(.3, 14, 10), mat(0x24324a), 0, 0, .2); body.scale.set(.85, 1.25, .5);
    const belly = mesh(new THREE.SphereGeometry(.26, 14, 10), mat(0xffffff), 0, -.02, .32); belly.scale.set(.75, 1.15, .35);
    const head = mesh(new THREE.SphereGeometry(.17, 12, 8), mat(0x24324a), 0, .36, .22);
    const beak = mesh(new THREE.ConeGeometry(.06, .16, 6), mat(0xffa83f), 0, .54, .22);
    const fl1 = mesh(new THREE.BoxGeometry(.28, .08, .04), mat(0x24324a), -.34, .05, .22);
    const fl2 = mesh(new THREE.BoxGeometry(.28, .08, .04), mat(0x24324a), .34, .05, .22);
    this.peng.add(body, belly, head, beak, fl1, fl2);
    this.peng.position.set(this.px, 0, 0);
    W.add(this.peng);
    this.layout();   // 「スタート前」の表示のために、最初の並べ方を済ませておく（障害物とゴールは遠くて見えない）
    this.hint("傾けて、よけて、布をくぐれ");
  }
  grow(obj, ahead, see) {   // 近づくと氷から生えてくる（見え始めの距離 see）
    const k = Math.max(0, Math.min(1, (see - ahead) / 2.5));
    obj.visible = k > 0; obj.scale.set(1, 1, Math.max(.001, k));
  }
  layout() {   // 道・障害物・ゴールを、今の走った距離 this.s に合わせて並べる
    for (const r of this.rows) {
      const S = this.s + r.y;
      const par = ((Math.floor(S / 1.1) % 2) + 2) % 2;
      r.L.material = r.R.material = this.iceMats[par];
      const past = S >= this.sFork;                    // 分かれ道より先は、ゴール側の道しかない
      r.L.visible = !past || this.goalSide < 0;
      r.R.visible = !past || this.goalSide > 0;
    }
    for (const o of this.obs) { o.g.position.set(o.lane * this.laneX, o.s - this.s, 0); this.grow(o.g, o.s - this.s, this.SEE); }
    this.gate.position.set(0, this.sFork - this.s, 0); this.grow(this.gate, this.sFork - this.s, this.SEE + 2);
  }
  update(dt) {
    const t = this.tilt();
    if (!this.result) this.s += this.speed * dt;
    const tx = Math.abs(t.x) < this.DEAD ? 0 : t.x;
    const target = this.result ? 0 : tx * this.KX;
    this.vx += (target - this.vx) * Math.min(1, dt * this.INERTIA);   // 慣性：すぐには曲がらず、すべる
    const lim = this.roadHalf - .25;
    this.px = Math.max(-lim, Math.min(lim, this.px + this.vx * dt));
    if (Math.abs(this.px) >= lim) this.vx = 0;
    if (!this.fell) { this.peng.position.x = this.px; this.peng.rotation.z = -this.vx * .08; }
    this.layout();
    if (this.fell) {                                    // 道が途切れて落ちる
      const k = Math.max(.001, this.peng.scale.x - dt * 1.2);
      this.peng.scale.set(k, k, k); this.peng.position.z -= dt * 3; this.peng.position.y += dt * 1.5;
      return;
    }
    if (this.result) return;
    for (const o of this.obs) {
      if (Math.abs(this.s - o.s) < .35 && Math.abs(this.px - o.lane * this.laneX) < this.obsHalf + this.penR * .6) {
        this.lose(); return;
      }
    }
    if (this.s >= this.sFork) {
      if (Math.sign(this.px) === this.goalSide) this.win();
      else { this.fell = true; this.lose(); }
    }
  }
}

/* ---- なんびき？：水槽を泳ぐ金魚を数えて、正しい数のボタンを押す（チャンスは1回） ---- */
function panelButton(p, text, fill, stroke = "#ffffff") {   // 数字ボタンの絵を描く（丸い四角＋数字）
  const { ctx, canvas, tex } = p, W = canvas.width, H = canvas.height, r = 36;
  ctx.clearRect(0, 0, W, H);
  ctx.beginPath(); ctx.moveTo(r, 6); ctx.arcTo(W - 6, 6, W - 6, H - 6, r); ctx.arcTo(W - 6, H - 6, 6, H - 6, r);
  ctx.arcTo(6, H - 6, 6, 6, r); ctx.arcTo(6, 6, W - 6, 6, r); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = stroke; ctx.stroke();
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 110px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, W / 2, H / 2 + 6);
  tex.needsUpdate = true;
}
class CountGame extends MiniGame {
  static meta = { id: "count", instruction: "なんびき？" };
  setup() {
    const { w, h } = Engine.viewSize(0);
    const d = Math.min(this.difficulty, 12);
    const lv = this.difficulty;                                  // 総クリア数（テストモードではテストのレベル）
    const [lo, hi] = lv <= 10 ? [7, 10] : lv <= 20 ? [8, 12] : lv <= 30 ? [9, 15] : [10, 18];   // TODO: 金魚の数の範囲
    this.n = lo + Math.floor(Math.random() * (hi - lo + 1));
    // 水槽  TODO: 水槽・背景の画像/モデルに差し替え
    const tw = Math.min(w - .5, 4.6), top = h / 2 - 3.5, bot = -h / 2 + .9, th = top - bot, cy = (top + bot) / 2;
    this.add(mesh(new THREE.PlaneGeometry(tw, th), mat(0x7fd0ff, { transparent: true, opacity: .6 }), 0, cy, -.2));
    this.add(mesh(new THREE.BoxGeometry(tw + .3, .3, .5), mat(0xe8d29a), 0, bot + .1, .1));            // 砂
    for (const x of [-tw * .32, tw * .1, tw * .36]) this.add(mesh(new THREE.CylinderGeometry(.06, .08, 1.1, 6), mat(0x3fa65a), x, bot + .7, -.1));   // 水草
    const frame = mat(0xdff4ff);
    this.add(mesh(new THREE.BoxGeometry(tw + .3, .15, .5), frame, 0, top + .05, .1),
             mesh(new THREE.BoxGeometry(.15, th + .2, .5), frame, -tw / 2 - .08, cy, .1),
             mesh(new THREE.BoxGeometry(.15, th + .2, .5), frame, tw / 2 + .08, cy, .1));
    this.box = { x0: -tw / 2 + .3, x1: tw / 2 - .3, y0: bot + .7, y1: top - .3 };
    // 金魚  TODO: 金魚のモデルに差し替え
    const cols = [0xff7a1a, 0xff5a3c, 0xffa31a, 0xff6a6a];
    this.fish = [];
    for (let i = 0; i < this.n; i++) {
      const col = mat(cols[i % cols.length]);
      const g = new THREE.Group();
      const body = mesh(new THREE.SphereGeometry(.15, 12, 8), col, 0, 0, 0); body.scale.set(1.3, .9, .5);
      const tail = mesh(new THREE.ConeGeometry(.1, .24, 6), col, -.27, 0, 0); tail.rotation.z = Math.PI / 2;
      g.add(body, tail, mesh(new THREE.SphereGeometry(.03, 6, 6), mat(0x111111), .13, .04, .08));
      const f = { g, x: rand(this.box.x0, this.box.x1), y: rand(this.box.y0, this.box.y1), vx: rand(.45, .95) * (1 + d * .04) * (Math.random() < .5 ? -1 : 1),
                  ph: rand(0, 6.28), fr: rand(.8, 1.6), amp: rand(.1, .35), turn: rand(.8, 2.5) };
      g.position.z = .02 + (i % 9) * .02;
      this.add(g); this.fish.push(f);
    }
    // 数字ボタンは連番（例：正解が10なら 8・9・10 / 9・10・11 / 10・11・12 のどれか）。数えないと分からない
    const first = this.n - Math.floor(Math.random() * 3);   // 正解は、3つのうち左・真ん中・右のどれかになる
    const nums = [first, first + 1, first + 2];
    const gap = Math.min(1.55, w * .3);
    this.btns = nums.map((num, i) => {
      const p = makeCanvasPanel(1.3, .98, 256, 194);
      panelButton(p, String(num), "#3f8cff");
      p.plane.position.set((i - 1) * gap, h / 2 - 2.5, .6);
      this.add(p.plane); this.track(p.tex);
      return { num, p, plane: p.plane };
    });
    this.hint("金魚は何匹？");
    this.update(0, 0);
  }
  update(dt) {
    const b = this.box;
    for (const f of this.fish) {
      f.turn -= dt;
      if (f.turn <= 0) { f.turn = rand(.8, 2.5); if (Math.random() < .35) f.vx = -f.vx; }
      f.x += f.vx * dt; f.ph += f.fr * dt;
      if (f.x < b.x0) { f.x = b.x0; f.vx = Math.abs(f.vx); } else if (f.x > b.x1) { f.x = b.x1; f.vx = -Math.abs(f.vx); }
      const y = Math.max(b.y0, Math.min(b.y1, f.y + Math.sin(f.ph) * f.amp));
      f.g.position.x = f.x; f.g.position.y = y;
      f.g.scale.x = f.vx >= 0 ? 1 : -1;
    }
  }
  onTap(info) {
    if (this.result) return;
    const hit = this.pick(info, this.btns.map((b) => b.plane));
    if (!hit) return;
    const b = this.btns.find((x) => x.plane === hit.object);
    if (b.num === this.n) { panelButton(b.p, String(b.num), "#2fb36a"); this.win(); }
    else {
      panelButton(b.p, String(b.num), "#e04a5a"); this.lose();
      const ok = this.btns.find((x) => x.num === this.n); panelButton(ok.p, String(ok.num), "#2fb36a");
      this.hint(`正解は ${this.n} 匹`);
    }
  }
}

/* ---- たべて！：大きなハンバーガーを連続タップで食べきる ---- */
class BurgerGame extends MiniGame {
  static meta = { id: "burger", instruction: "たべて！" };
  setup() {
    const { w, h } = Engine.viewSize(0);
    const d = Math.min(this.difficulty, 12);
    this.NEED = 22 + Math.min(d, 6);          // TODO: 食べきるのに必要なタップ数
    this.taps = 0; this.pulse = 0; this.crumbs = [];
    this.limY = -h / 2 - 1;
    const S = Math.min(1, w / 4.4);
    this.bg = this.add(new THREE.Group()); this.bg.scale.setScalar(S); this.bg.position.y = -.4;
    // お皿  TODO: お皿のモデル/画像に差し替え
    this.bg.add(mesh(new THREE.CylinderGeometry(2.3, 2.0, .15, 28), mat(0xf4f4f8), 0, -2.1, -.1));
    // 具材（下から積む）  TODO: ハンバーガーのモデル/画像に差し替え
    const defs = [   // 下→上：[半径, 高さ, 色, 形]
      [1.5, .5, 0xd9902f, "cyl"], [1.6, .1, 0xffd23f, "cheese"], [1.55, .45, 0x6b3a1e, "cyl"],
      [1.45, .2, 0xe8483a, "cyl"], [1.65, .16, 0x6fcf4a, "cyl"], [1.5, .85, 0xd9902f, "dome"],
    ];
    let y = -2.0; this.layers = [];
    for (const [R, H, col, kind] of defs) {
      let m;
      if (kind === "dome") { m = mesh(new THREE.SphereGeometry(R, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat(col)); m.scale.y = H / R; m.position.y = y; }
      else if (kind === "cheese") { m = mesh(new THREE.CylinderGeometry(R, R, H, 4), mat(col)); m.rotation.y = Math.PI / 4; m.position.y = y + H / 2; }
      else { m = mesh(new THREE.CylinderGeometry(R, R, H, 24), mat(col)); m.position.y = y + H / 2; }
      this.bg.add(m); this.layers.push({ m, R });
      y += H;
    }
    this.layers.reverse();   // 上から食べる
    this.hint(`あと${this.NEED}回`);
  }
  update(dt) {
    this.pulse = Math.max(0, this.pulse - dt * 5);
    this.bg.scale.y = this.bg.scale.x * (1 - this.pulse * .05);
    const per = this.NEED / this.layers.length;
    this.layers.forEach((L, i) => {
      const f = Math.max(0, Math.min(1, (this.taps - i * per) / per));    // この具材をどこまで食べたか（左から残す）
      L.m.visible = f < 1;
      L.m.scale.x = Math.max(.001, 1 - f);
      L.m.position.x = -L.R * f;
    });
    for (const c of this.crumbs) { c.vy -= 9 * dt; c.m.position.x += c.vx * dt; c.m.position.y += c.vy * dt; c.m.rotation.z += dt * 6; c.m.visible = c.m.position.y > this.limY; }
  }
  onTap() {
    if (this.result) return;
    this.taps++; this.pulse = 1;
    this.hint(this.taps >= this.NEED ? "ごちそうさま！" : `あと${this.NEED - this.taps}回`);
    const per = this.NEED / this.layers.length, i = Math.min(this.layers.length - 1, Math.floor(this.taps / per));
    const L = this.layers[i];
    for (let k = 0; k < 3; k++) {   // パンくず
      const m = mesh(new THREE.BoxGeometry(.12, .12, .12), mat(0xe8b25a), L.R * (1 - 2 * Math.min(1, (this.taps - i * per) / per)) + rand(-.3, .3), L.m.position.y, .6);
      this.bg.add(m); this.crumbs.push({ m, vx: rand(.5, 2), vy: rand(1.5, 3.5) });
    }
    if (this.taps >= this.NEED) this.win();
  }
}

/* ---- けずって！：かき氷機のハンドルを、画面を押したままグルグル回して氷を削る ----
   一定量削れたらクリア。ぎりぎり時間内でも、そのあとシロップがかかって完成のポップアップが出る */
class ShaveGame extends MiniGame {
  static meta = { id: "shave", instruction: "けずって！", resultTime: 2.0, earlyInput: true };
  setup() {
    const { w, h } = Engine.viewSize(0);
    const d = Math.min(this.difficulty, 12);
    this.NEED = (5 + Math.min(d, 10) * .25) * Math.PI * 2;      // TODO: 必要な回転量（ラジアン）。いまは5周＋レベルごとに1/4周
    this.started = false; this.cw = 0; this.ccw = 0; this.vis = 0; this.handleRot = 0; this.drag = null; this.fin = -1; this.emit = 0;
    this.C = new THREE.Vector3(0, Math.min(3.2, h / 2 - 2.7), 1.6);   // ハンドルの中心（氷より手前に置く）
    // かき氷機  TODO: かき氷機のモデル/画像に差し替え
    this.add(mesh(new THREE.BoxGeometry(3.4, 5.1, .3), mat(0xcfe8ff), 0, 1.5, -.3));
    this.add(mesh(new THREE.BoxGeometry(3.8, .4, .9), mat(0x6f7fa8), 0, -1.05, 0));
    const ig = new THREE.CylinderGeometry(1.0, 1.0, 1.6, 24); ig.translate(0, .8, 0);
    this.ice = this.add(mesh(ig, mat(0xdff6ff, { transparent: true, opacity: .85, roughness: .15 }), 0, .9, .3));
    // ハンドル（回す所）
    this.handle = this.add(new THREE.Group()); this.handle.position.copy(this.C);
    this.handle.add(mesh(new THREE.SphereGeometry(.3, 14, 10), mat(0xc9ced9), 0, 0, 0),
                    mesh(new THREE.BoxGeometry(1.0, .16, .16), mat(0xc9ced9), .5, 0, 0),
                    mesh(new THREE.SphereGeometry(.24, 12, 8), mat(0xff5a6e), 1.0, 0, 0));
    const ring = mesh(new THREE.TorusGeometry(1.0, .03, 6, 40), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .45 }), this.C.x, this.C.y, .2);
    this.add(ring);
    // 器と、たまる氷
    this.add(mesh(new THREE.CylinderGeometry(1.35, .85, .75, 24), mat(0xff8fb3), 0, -2.95, 0));
    this.pileY = -2.55;
    this.pile = this.add(mesh(new THREE.SphereGeometry(1.0, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xffffff), 0, this.pileY, 0));
    this.pile.scale.set(.001, .001, .001);
    this.flakes = [];
    for (let i = 0; i < 16; i++) { const m = this.add(mesh(new THREE.SphereGeometry(.07, 6, 6), mat(0xffffff), 0, 0, .7)); m.visible = false; this.flakes.push({ m, vy: 0 }); }
    // シロップ（完成の演出用）
    this.syrupCol = shuffle([0xff4f7b, 0x7be04a, 0x4aa8ff, 0xffc23a])[0];
    this.drops = [];   // シロップのしずく（棒のような筋ではなく、ぽたぽた落ちる）
    for (let i = 0; i < 14; i++) { const m = this.add(mesh(new THREE.SphereGeometry(.1, 8, 8), mat(this.syrupCol), 0, 0, 1.2)); m.visible = false; this.drops.push({ m, vy: 0, t0: i * .045, on: false }); }
    this.cover = this.add(mesh(new THREE.SphereGeometry(1.0, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat(this.syrupCol, { transparent: true, opacity: .85 }), 0, this.pileY, 0));
    this.cover.scale.set(.001, .001, .001);
    this.pop = makeCanvasPanel(3.2, 1.0, 512, 160);
    this.pop.ctx.fillStyle = "#fff7d6"; this.pop.ctx.fillRect(0, 0, 512, 160);
    this.pop.ctx.fillStyle = "#e8486a"; this.pop.ctx.font = "bold 84px sans-serif"; this.pop.ctx.textAlign = "center"; this.pop.ctx.textBaseline = "middle";
    this.pop.ctx.fillText("できあがり！", 256, 84); this.pop.tex.needsUpdate = true;
    this.pop.plane.position.set(0, -4.2, 1.2); this.pop.plane.scale.setScalar(.001);
    this.add(this.pop.plane); this.track(this.pop.tex);
    this.hint("ハンドルを押したままグルグル");
  }
  get prog() { return Math.min(1, Math.max(this.cw, this.ccw) / this.NEED); }
  update(dt, t) {
    this.started = t > 0;   // カウントが始まってから回した分だけ数える
    const prev = this.vis;
    this.vis += (this.prog - this.vis) * Math.min(1, dt * 14);
    this.handle.rotation.z = this.handleRot;
    this.ice.scale.y = Math.max(.04, 1 - this.vis * .96);
    const k = Math.pow(this.vis, .75);
    this.pile.scale.set(1.2 * k + .001, 1.1 * k + .001, 1.0 * k + .001);
    // 削れた氷が落ちる
    this.emit += Math.max(0, this.vis - prev) * 60;
    while (this.emit >= 1) {
      this.emit -= 1;
      const f = this.flakes.find((q) => !q.m.visible); if (!f) break;
      f.m.visible = true; f.m.position.set(rand(-.5, .5), .75, .7); f.vy = -1;
    }
    for (const f of this.flakes) if (f.m.visible) {
      f.vy -= 9 * dt; f.m.position.y += f.vy * dt;
      if (f.m.position.y < this.pileY + 1.1 * k - .05) f.m.visible = false;
    }
    // 完成の演出：シロップがかかって「できあがり！」
    if (this.result === "win") {
      if (this.fin < 0) this.fin = 0;
      this.fin += dt;
      const t = this.fin;
      const top = this.pileY + 1.1 * k;
      for (const d of this.drops) {
        if (!d.on && t >= d.t0 && t < d.t0 + .5) { d.on = true; d.m.visible = true; d.m.position.set(rand(-.6, .6), top + 2.2, 1.2); d.vy = -2; }
        if (d.on) { d.vy -= 14 * dt; d.m.position.y += d.vy * dt; if (d.m.position.y < top - .1) { d.on = false; d.m.visible = false; d.t0 = 99; } }
      }
      const c = Math.max(0, Math.min(1, (t - .3) / .6));
      this.cover.scale.set(1.2 * k * c * 1.04 + .001, 1.1 * k * c * 1.04 + .001, 1.04 * k * c + .001);
      const p = Math.max(0, Math.min(1, (t - .8) / .35));
      this.pop.plane.scale.setScalar(p < 1 ? Math.max(.001, p * 1.15) : 1);
    }
  }
  onTap(info) {
    if (this.result || this.drag) return;
    const c = this.toScreen(this.C), e = this.toScreen(new THREE.Vector3(this.C.x + 1.6, this.C.y, this.C.z));
    const rad = Math.hypot(e.x - c.x, e.y - c.y);
    if (Math.hypot(info.x - c.x, info.y - c.y) < rad) this.drag = { id: info.id, ang: Math.atan2(info.y - c.y, info.x - c.x) };
  }
  onDrag(info) {
    const g = this.drag;
    if (!g || g.id !== info.id || this.result) return;
    const c = this.toScreen(this.C);
    if (Math.hypot(info.x - c.x, info.y - c.y) < 8) return;
    const a = Math.atan2(info.y - c.y, info.x - c.x);
    let da = a - g.ang;
    while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
    g.ang = a;
    if (!this.started) return;   // カウント前は、つかんだままの位置から始められるだけ（まだ数えない）
    if (da > 0) this.cw += da; else this.ccw -= da;
    this.handleRot -= da;
    this.hint(this.prog >= 1 ? "" : "ハンドルを押したままグルグル");
    if (this.prog >= 1) this.win();
  }
  onRelease(info) { if (this.drag && this.drag.id === info.id) this.drag = null; }
}

/* ---- ウェーブ：長押しでしゃがみ、離すと立つ。自分の所へ来たウェーブに合わせて立ち上がる ----
   8〜10人が並び、ウェーブは左から右へ進み、端で折り返して左へ戻る。自分は端と端から2番目以外のランダムな1人（色が違う）。
   STAND_UP = true : みんな普通はしゃがんでいて、ウェーブが来た人だけ立ち上がる（スタジアムのウェーブ）。
                      → 最初から押し続けて（しゃがんで）待ち、来たら離して立つ。
   STAND_UP = false: みんな普通は立っていて、ウェーブが来た人だけしゃがむ。 */
class WaveGame extends MiniGame {
  static meta = { id: "wave", instruction: "ウェーブ！", winOnTimeout: true, instructionTime: 2.4, earlyInput: true };
  setup() {
    const { w } = Engine.viewSize(0);
    const d = Math.min(this.difficulty, 12);
    this.STAND_UP = true;
    this.n = 8 + Math.floor(Math.random() * 3);                    // 8〜10人
    this.me = 2 + Math.floor(Math.random() * (this.n - 4));        // 端と端から2番目は除く
    this.T = this.duration; this.L = .6;                            // 5秒かけて往復。最初に少し待つ
    this.D = (this.T / 2 - this.L) / (this.n - 1);                  // となりへウェーブが移る時間
    this.Wt = this.D * 1.4;                                         // 1人が立っている長さ（の目安）
    this.tolIn = this.Wt * (.18 - Math.min(d, 10) * .006);          // 自分の番の前後これだけは、必ず立っていること（小さいほど難しい）
    this.tolOut = this.Wt * 1.4;                                    // 自分の番からこれ以上離れた時は、元の姿勢（しゃがむ）に戻っていること
    this.wt = 0; this.c = 0; this.holding = new Set(); this.frozen = false;
    const sp = Math.min(.55, (w - .5) / (this.n - 1)), S = Math.min(1.4, sp / .5 * 1.1);
    this.sp = sp;
    // 床・背景  TODO: 観客席などの背景に差し替え
    this.add(mesh(new THREE.PlaneGeometry(w + 2, 1.2), mat(0x3a8f5a), 0, -1.7, -.3));
    this.people = [];
    for (let i = 0; i < this.n; i++) {
      const isMe = i === this.me, col = isMe ? 0xffc83f : 0x4aa8ff;   // 色は2色だけ：自分が動かす人（黄色）とそれ以外（青）
      // 人（原点＝足元）  TODO: 人のモデル/画像に差し替え
      const g = new THREE.Group();
      g.add(mesh(new THREE.BoxGeometry(.26, .35, .2), mat(0x39425e), 0, .18, 0),
            mesh(new THREE.BoxGeometry(.32, .45, .22), mat(col), 0, .58, 0),
            mesh(new THREE.SphereGeometry(.15, 12, 8), mat(0xffd9b3), 0, .97, 0));
      const mk = (sx) => { const a = new THREE.Group(); a.position.set(sx * .2, .75, 0); a.add(mesh(new THREE.BoxGeometry(.09, .38, .09), mat(col), 0, -.19, 0)); g.add(a); return a; };
      const armL = mk(-1), armR = mk(1);
      g.position.set((i - (this.n - 1) / 2) * sp, -1.7, .2 + (isMe ? .05 : 0));
      g.scale.setScalar(S);
      this.add(g);
      this.people.push({ g, armL, armR });
    }
    this.hint("長押し→しゃがむ　離す→立つ");
    this.update(0, 0);
  }
  bump(x) { x = Math.abs(x); return x >= 1 ? 0 : .5 + .5 * Math.cos(Math.PI * x); }
  pulse(i, t) { return Math.max(this.bump((t - (this.L + i * this.D)) / this.Wt), this.bump((t - (this.T - this.L - i * this.D)) / this.Wt)); }
  update(dt, clock) {
    if (!this.frozen) this.wt = clock;   // ウェーブの時計はゲームの経過時間（カウント前は0のまま）
    const t = this.wt;
    this.c += ((this.holding.size > 0 ? 1 : 0) - this.c) * Math.min(1, dt * 16);   // 自分のしゃがみ具合（0=立つ 1=しゃがむ）
    this.people.forEach((p, i) => {
      const pu = this.pulse(i, t);
      const k = i === this.me ? this.c : (this.STAND_UP ? 1 - pu : pu);            // しゃがみ具合
      p.g.scale.y = p.g.scale.x * (1 - .4 * k);
      const up = this.STAND_UP ? (1 - k) : 0;                                      // 立った時は両手を上げる
      p.armL.rotation.z = -up * 2.9; p.armR.rotation.z = up * 2.9;
    });
    if (this.result) return;
    // 判定：自分のウェーブ（行きと帰りの2回）に合わせられているか
    const tp1 = this.L + this.me * this.D, tp2 = this.T - this.L - this.me * this.D;
    const crouched = this.holding.size > 0;   // 判定は指の状態そのまま（見た目のなめらかな動きとは別）
    const pulseNeed = !this.STAND_UP;      // ウェーブが来た瞬間にいるべき姿勢（true=しゃがむ）。それ以外の時は反対の姿勢
    for (const tp of [tp1, tp2]) if (Math.abs(t - tp) < this.tolIn && crouched !== pulseNeed) return this.stop();
    const first = this.STAND_UP ? Math.max(.55, tp1 - 1.0) : .55;   // 押し始める猶予（開始直後は判定しない）
    const inOut = (t > first && t < tp1 - this.tolOut) || (t > tp1 + this.tolOut && t < tp2 - this.tolOut);
    if (inOut && crouched === pulseNeed) return this.stop();
  }
  stop() { this.frozen = true; this.hint("ウェーブが止まった！"); this.lose(); }   // ウェーブを止めたら失敗
  onTap(info) { if (!this.result) this.holding.add(info.id); }
  onRelease(info) { this.holding.delete(info.id); }
}

/* ---- ぴったり！：スマホを傾けて牛乳を注ぎ、ふちギリギリのラインで止める ----
   スマホを左へ傾けるほど紙パックが倒れて、たくさん出る。戻すと止まる（右へ傾けても注がない）。
   黄色い線からふち（赤い線）までの間で止めれば成功。ふちを超えたらあふれて失敗。
   止めても牛乳は少し出続けるので、その分を見越して戻すのがコツ。
   ※傾きが使えない時（振る・傾ける操作がOFFなど）は、画面を押し続けて注ぐ方式で遊べます。
     傾き専用にしたい場合は、meta に requires: ["tilt"] を足すだけ */
class MilkGame extends MiniGame {
  static meta = { id: "milk", instruction: "ぴったり！" };
  setup() {
    this.H = 2.3; this.baseY = -3.4;
    const R = .95, H = this.H;
    const d = Math.min(this.difficulty, 12);
    this.band = Math.max(.15, .27 - d * .01);       // 成功ゾーンの高さ（小さいほど難しい）
    this.lineLow = H - this.band;
    this.rate = 1.4 + d * .04;                        // 全開で傾けた時の注ぐ速さ（単位/秒）
    this.level = 0; this.flow = 0; this.pour = 0;
    this.holding = new Set(); this.overflow = false; this.spill = 0;
    this.mode = Features.tilt() ? "tilt" : "touch";
    this.POUR_LEFT = true;   // スマホを「左」へ傾けると注ぐ（紙パックが左へ倒れるのと同じ向き）。右にしたいなら false
    this.DEAD_TILT = .1;     // TODO: これより小さい傾き（約6°）は無視。手ぶれで出てしまう時は大きく
    this.FULL_TILT = .6;     // TODO: この傾き（約37°）で全開。大きいほどゆっくり注ぐ操作になる
    const rAt = (y) => R * .86 + R * .14 * (y / H);
    // コップ  TODO: コップのモデル/画像に差し替え
    const glassMat = mat(0xcfeaff, { transparent: true, opacity: .28, roughness: .1, side: THREE.DoubleSide });
    this.add(mesh(new THREE.CylinderGeometry(R, R * .86, H, 32, 1, true), glassMat, 0, this.baseY + H / 2, 0));
    this.add(mesh(new THREE.CylinderGeometry(R * .86, R * .86, .08, 32), glassMat, 0, this.baseY + .02, 0));
    // 牛乳  TODO: 牛乳の色/テクスチャ
    const mg = new THREE.CylinderGeometry(R * .93, R * .84, 1, 32); mg.translate(0, .5, 0);
    this.milk = this.add(mesh(mg, mat(0xfffdf6, { roughness: .35 }), 0, this.baseY + .05, 0));
    this.milk.scale.y = .001;
    const ring = (y, color) => {
      const m = mesh(new THREE.TorusGeometry(rAt(y), .035, 8, 40), new THREE.MeshBasicMaterial({ color }), 0, this.baseY + y, 0);
      m.rotation.x = Math.PI / 2;
      return this.add(m);
    };
    ring(this.lineLow, 0xffcf3f);   // ここから成功
    ring(H, 0xff5a6e);              // ふち（これを超えるとあふれる）
    // 紙パック  TODO: 紙パックのモデル/画像に差し替え。原点＝注ぎ口
    this.carton = this.add(new THREE.Group());
    const white = mat(0xfdfdff);
    this.carton.add(
      mesh(new THREE.BoxGeometry(1.3, 2.0, 1.0), white, .7, -1.0, 0),
      mesh(new THREE.BoxGeometry(1.32, .5, 1.02), mat(0x3f8cff), .7, -.7, 0),
      mesh(new THREE.ConeGeometry(.85, .55, 4), mat(0xe8eef8), .7, .275, 0),
      mesh(new THREE.BoxGeometry(.22, .1, .3), mat(0xe8eef8), .02, .02, 0),
    );
    this.carton.children[2].rotation.y = Math.PI / 4;
    const label = makeCanvasPanel(1.0, .6, 256, 150);
    label.ctx.fillStyle = "#ffffff"; label.ctx.fillRect(0, 0, 256, 150);
    label.ctx.fillStyle = "#2f6fe0"; label.ctx.font = "bold 70px sans-serif"; label.ctx.textAlign = "center"; label.ctx.textBaseline = "middle";
    label.ctx.fillText("MILK", 128, 78);
    label.tex.needsUpdate = true;
    label.plane.position.set(.7, -.7, .52);
    this.carton.add(label.plane); this.track(label.tex);
    // 牛乳の筋
    this.stream = this.add(mesh(new THREE.CylinderGeometry(.07, .07, 1, 10), mat(0xfffdf6), 0, 0, .3));
    this.stream.visible = false;
    this.puddle = this.add(mesh(new THREE.CylinderGeometry(1, 1, .04, 32), mat(0xfffdf6), 0, this.baseY - .02, 0));
    this.puddle.scale.set(.001, 1, .001);
    this.hint(this.mode === "tilt" ? "傾けて注ぐ（戻すと止まる）" : "押し続けて注ぐ");
  }
  update(dt) {
    // どれだけ注ごうとしているか（0〜1）。傾けるほど／押している間だけ大きくなる
    let amt = 0;
    if (!this.result) {
      if (this.mode === "tilt") {
        const tx = this.tilt().x;
        const along = this.POUR_LEFT ? -tx : tx;   // 注ぐ向きへの傾き。反対側へ戻しすぎても注がない
        amt = Math.max(0, Math.min(1, (along - this.DEAD_TILT) / (this.FULL_TILT - this.DEAD_TILT)));
      }
      else amt = this.holding.size > 0 ? 1 : 0;
    }
    this.pour += (amt - this.pour) * Math.min(1, dt * 9);                  // 紙パックの傾き
    const p = this.pour;
    this.carton.position.set(.9 - 1.0 * p, this.baseY + this.H + .7 + .45 * p, 1.2);
    this.carton.rotation.z = p * .95;
    const ft = Math.max(0, (p - .08) / .92);                                 // 傾けるほど勢いが増す（少しなら、ちょろちょろ）
    this.flow += (ft - this.flow) * Math.min(1, dt * 10);                    // 戻しても少し出続ける
    if (!this.result && !this.overflow) this.level += this.flow * this.rate * dt;
    if (!this.result && !this.overflow && this.level > this.H + .02) {
      this.overflow = true; this.level = this.H + .02; this.lose();
    }
    if (!this.result && amt < .25 && this.flow < .03 && this.level >= this.lineLow && this.level <= this.H + .02) this.win();
    this.milk.scale.y = Math.max(.001, Math.min(this.level, this.H + .02));
    // 筋
    const top = this.carton.position.y;
    const bottom = this.overflow ? this.baseY : this.baseY + .05 + this.level;
    const len = Math.max(.01, top - bottom);
    this.stream.visible = this.flow > .03 || (this.overflow && this.flow > .01);
    this.stream.position.set(this.carton.position.x - .03, (top + bottom) / 2, .3);
    this.stream.scale.y = len;
    if (this.overflow) {   // あふれて広がる
      this.spill = Math.min(2.2, this.spill + dt * 2.2);
      this.puddle.scale.set(this.spill, 1, this.spill);
    }
  }
  onTap(info) { if (!this.result) this.holding.add(info.id); }
  onRelease(info) { this.holding.delete(info.id); }
  onTimeUp() {
    if (this.level >= this.lineLow && this.level <= this.H + .02) this.win(); else this.lose();
  }
}

/* =====================================================================
   10. GameManager（全体の流れ）
      title → instruction(1秒) → playing(5秒) → result(1秒) → 次のゲーム
                                                       └→ 失敗なら gameover
   ===================================================================== */
const GameManager = {
  state: "title",
  score: 0,
  current: null,
  lastClass: null,
  timer: 0,
  playTime: 0,

  init() {
    UI.startScreen.addEventListener("pointerdown", (e) => { e.stopPropagation(); this.startRun(); });
    UI.overScreen.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      if (this.timer > 0.6) this.startRun();
    });
    Input.handler = this;
    Motion.handler = this;
    this.initMotionToggle();
    this.initTestMode();
  },

  /* ---------- テストモード ----------
     一覧から選んだゲームだけを遊ぶ。終わったら（クリアでも失敗でも）一覧に戻る。
     「順番に全部」は、失敗しても止まらず登録順に最後まで流す。 */
  mode: "normal",       // "normal" | "test"
  testQueue: [],
  testLevel: 0,
  REQUIRE_LABELS: {
    motion: "振る・傾ける操作をONにすると遊べます",
    tilt: "振る・傾ける操作をONにすると遊べます（傾き対応の端末のみ）",
  },

  initTestMode() {
    const stop = (el) => el.addEventListener("pointerdown", (e) => e.stopPropagation());
    const open = UI.$("testOpen");
    stop(open);
    open.addEventListener("click", (e) => { e.stopPropagation(); this.openTest(); });
    UI.$("testAll").addEventListener("click", () => this.startTest(GameRegistry.available()));
    UI.$("testBack").addEventListener("click", () => {
      UI.show(UI.$("testScreen"), false);
      UI.show(UI.startScreen, true);
      this.mode = "normal";
      this.enter("title");
    });
    const setLv = (d) => {
      this.testLevel = Math.max(0, Math.min(20, this.testLevel + d));
      UI.$("lvValue").textContent = this.testLevel;
    };
    UI.$("lvDown").addEventListener("click", () => setLv(-1));
    UI.$("lvUp").addEventListener("click", () => setLv(1));
    UI.$("testCalib").addEventListener("click", () => Motion.calibrate());
  },

  /** テスト画面の「センサー：…」表示を更新（毎フレーム呼ばれる） */
  updateSensorInfo() {
    const el = this._sensorEl || (this._sensorEl = UI.$("sensorInfo"));
    let txt;
    if (!Motion.enabled) txt = "センサー：OFF（スタート画面で「振る・傾ける操作」をON）";
    else {
      const t = Motion.tilt();
      txt = `振る：○　傾き：${Motion.tiltOk ? "○" : "×"}　x ${t.x.toFixed(2)}　y ${t.y.toFixed(2)}`;
    }
    if (el.textContent !== txt) el.textContent = txt;
  },

  openTest() {
    Motion.calibrate();   // 開いた時の持ち方を基準にする
    if (this.current) { this.current.dispose(); this.current = null; }
    UI.hideBanner();
    UI.show(UI.hud, false);
    UI.show(UI.startScreen, false);
    UI.show(UI.overScreen, false);
    // 一覧を作り直す（振る操作のON/OFFで遊べるゲームが変わるため）
    const list = UI.$("testList");
    list.textContent = "";
    GameRegistry.list.forEach((G) => {
      const missing = (G.meta.requires || []).filter((n) => !Features[n]?.());
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "game-btn";
      btn.disabled = missing.length > 0;
      const name = document.createElement("b");
      name.textContent = G.meta.instruction;
      const note = document.createElement("small");
      note.textContent = missing.length ? missing.map((n) => this.REQUIRE_LABELS[n] || n).join(" / ") : G.meta.id;
      btn.append(name, note);
      btn.addEventListener("click", () => this.startTest([G]));
      list.append(btn);
    });
    UI.show(UI.$("testScreen"), true);
    this.mode = "test";
    this.enter("test");
  },

  startTest(classes) {
    if (!classes.length) return;
    this.mode = "test";
    this.testQueue = classes.slice();
    UI.show(UI.$("testScreen"), false);
    UI.show(UI.hud, true);
    UI.setScore("TEST");
    this.nextGame();
  },

  /** スタート画面の「振る操作」ボタン */
  initMotionToggle() {
    const btn = UI.$("motionToggle"), status = UI.$("motionStatus");
    const render = () => {
      btn.setAttribute("aria-pressed", String(Motion.enabled));
      btn.textContent = `振る・傾ける操作：${Motion.enabled ? "ON" : "OFF"}`;
    };
    // ボタンに触れてもゲームが始まらないようにする
    btn.addEventListener("pointerdown", (e) => e.stopPropagation());
    // 許可ダイアログは click の中で出す必要がある（iPhone）
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (Motion.enabled) {
        Motion.disable(); render();
        status.textContent = "振る・傾けるゲームは出ません";
        return;
      }
      btn.disabled = true;
      status.textContent = "センサーを確認中…スマホを軽く動かしてください";
      const r = await Motion.enable();
      btn.disabled = false;
      render();
      status.textContent = {
        ok: "ON：振る・傾けるゲームも出てきます",
        "ok-notilt": "ON：振るゲームだけ遊べます（この端末は傾きを検出できませんでした）",
        unsupported: "この端末・ブラウザでは使えません",
        denied: "許可されなかったので OFF のままです",
        nodata: "この画面では使えません。ブラウザで直接開くと使える場合があります（Androidはサイト設定の「モーションセンサー」も確認）",
      }[r];
    });
  },

  startRun() {
    this.mode = "normal";
    this.score = 0;
    UI.setScore(0);
    UI.show(UI.startScreen, false);
    UI.show(UI.overScreen, false);
    UI.show(UI.hud, true);
    this.nextGame();
  },

  nextGame() {
    if (this.current) this.current.dispose();
    UI.setHint("");
    const test = this.mode === "test";
    const GameClass = test ? this.testQueue.shift() : GameRegistry.pickRandom(this.lastClass);
    this.lastClass = GameClass;
    this.duration = GameClass.meta.duration || CONFIG.gameTime;
    this.current = new GameClass({ engine: Engine, difficulty: test ? this.testLevel : this.score, duration: this.duration });
    this.current.setup();
    this.current.update(0, 0);   // 時間を進めずに1回だけ更新：スタート前の画面でも、動く物が「始まる位置」に並ぶ（原点に全部重なって見えるのを防ぐ）
    UI.setTime(this.duration, this.duration);
    UI.banner(GameClass.meta.instruction);
    this.enter("instruction");
    if (GameClass.meta.earlyInput) {   // すでに押さえている指があれば、その位置から始まったものとして渡す
      for (const [id, p] of Input.pointers) {
        this.current.onTap({ id, x: p.lx, y: p.ly, ndc: Input.ndc(p.lx, p.ly), startX: p.x, startY: p.y, dx: p.lx - p.x, dy: p.ly - p.y, prevX: p.lx, prevY: p.ly, elapsed: (performance.now() - p.t) / 1000 });
      }
    }
  },

  enter(state) { this.state = state; this.timer = 0; },

  // --- Input からの通知（プレイ中だけゲームに渡す） ---
  early() { return this.state === "instruction" && this.current.meta.earlyInput; },   // カウント前でも操作を受け付けるゲームか
  tap(info)        { if (this.state === "playing" || this.early()) this.current.onTap(info); },
  drag(info)       { if (this.state === "playing" || this.early()) this.current.onDrag(info); },
  release(info)    { if (this.state === "playing" || this.state === "result" || this.early()) this.current.onRelease(info); },
  swipe(dir, info) { if (this.state === "playing") this.current.onSwipe(dir, info); },
  shake(power)     { if (this.state === "playing") this.current.onShake(power); },
  motion(power)    { if (this.state === "playing") this.current.onMotion(power); },

  update(dt) {
    this.timer += dt;
    const g = this.current;
    switch (this.state) {
      case "instruction":
        if (g.meta.earlyInput) g.update(dt, 0);   // 時間は進めずに、指の動きだけ画面に反映する
        if (this.timer >= (g.meta.instructionTime || CONFIG.instructionTime)) {
          UI.hideBanner();
          this.playTime = 0;
          Motion.calibrate();   // この瞬間の持ち方を「水平」の基準にする
          this.enter("playing");
        }
        break;
      case "playing":
        this.playTime += dt;
        g._tick(dt, this.playTime);
        UI.setTime(this.duration - this.playTime, this.duration);
        if (!g.result && this.playTime >= this.duration) g.onTimeUp();
        if (g.result) this.finish(g.result);
        break;
      case "result":
        g._tick(dt, this.playTime += dt);   // 演出は続ける
        if (this.timer >= (g.meta.resultTime || CONFIG.resultTime)) {
          if (this.mode === "test") this.testQueue.length ? this.nextGame() : this.openTest();
          else if (this.lastResult === "win") this.nextGame();
          else this.gameOver();
        }
        break;
    }
  },

  finish(result) {
    this.lastResult = result;
    if (result === "win") {
      if (this.mode !== "test") { this.score++; UI.setScore(this.score); }
      UI.banner("CLEAR!", "clear");
    } else {
      UI.banner("GAME OVER", "fail");
    }
    this.enter("result");
  },

  gameOver() {
    UI.hideBanner();
    UI.show(UI.hud, false);
    UI.finalScore.textContent = this.score;
    UI.show(UI.overScreen, true);
    this.enter("gameover");
  },
};

/* ---------- 起動 ---------- */
UI.init();
UI.$("buildInfo").textContent = `ゲーム ${GameRegistry.list.length} 種　版 ${BUILD}`;
Engine.init(document.getElementById("stage"));
Input.init(document.getElementById("stage"));
GameManager.init();

// タイトル画面の飾り（TODO: タイトル用モデルに差し替え可）
const titleDeco = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6, 0), new THREE.MeshStandardMaterial({ color: 0xffcf3f, flatShading: true }));
Engine.scene.add(titleDeco);

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  titleDeco.visible = ["title", "gameover", "test"].includes(GameManager.state);
  if (titleDeco.visible) { titleDeco.rotation.x += dt * .4; titleDeco.rotation.y += dt * .6; }
  GameManager.update(dt);
  if (GameManager.state === "test") GameManager.updateSensorInfo();
  Engine.render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
